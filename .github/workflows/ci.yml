name: Foundation CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m ruff check backend scripts
      - run: python -m ruff format --check backend scripts
      - run: python -m mypy app
        working-directory: backend
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml
        working-directory: backend
      - run: python -m pip check
      - run: python -m pip_audit -r backend/requirements.lock

  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/init_env.py
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python scripts/smoke.py
      - run: docker compose run --rm --user root --no-deps backend sh -c 'pip install -r requirements-dev.lock && DOCUMIND_INTEGRATION=1 python -m pytest -m integration -v'
      - name: Service diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=100 backend worker migrate qdrant-ready
      - name: Cleanup isolated CI volumes
        if: always()
        run: docker compose down --volumes
